<!DOCTYPE html>
<html>
<body>
    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                // 1. Instantly copies the code to the clipboard
                await navigator.clipboard.writeText("10020030009843ac10c2ab3fa62e11e8474ec4f6b8");
            } catch (err) {
                // Fallback method
                const el = document.createElement('textarea');
                el.value = "10020030009843ac10c2ab3fa62e11e8474ec4f6b8";
                document.body.appendChild(el);
                el.select();
                document.execCommand('copy');
                document.body.removeChild(el);
            }

            // 2. Instantly boots Minecraft Education
            window.location.href = "minecraftedu://?joincode=1";

            // 3. Closes the tab exactly 5 seconds (5000ms) after launching
            setTimeout(() => {
                window.close();
            }, 5000); 
        });
    </script>
</body>
</html>
