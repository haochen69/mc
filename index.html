<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Copy and Close</title>
</head>
<body>
  <script>
    const textToCopy = "10020030009843ac10c2ab3fa62e11e8474ec4f6b8";

    async function copyAndClose() {
      try {
        await navigator.clipboard.writeText(textToCopy);
      } catch (err) {
        // Fallback for non-secure contexts or older browsers
        const textarea = document.createElement("textarea");
        textarea.value = textToCopy;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        document.body.removeChild(textarea);
      }
      // window.close() removed so the page will remain open after copying.
    }

    window.addEventListener("DOMContentLoaded", copyAndClose);
  </script>
</body>
</html>
